  <script>
    (function(){
      try {
        var pref = 'dark'; /* dark-only brand */
        var effective = (pref === 'light' || pref === 'dark') ? pref : (function(){ var h = new Date().getHours(); return (h >= 19 || h < 7) ? 'dark' : 'light'; })();
        document.documentElement.setAttribute('data-theme', effective);
        // Follow the device / country clock: with no manual override, re-evaluate the
        // theme on a timer and whenever the tab is shown again (covers timezone changes).
        var auto = function(){
          try {
            var p = 'dark'; /* dark-only brand */
            if (p === 'light' || p === 'dark') return;
            var h = new Date().getHours();
            document.documentElement.setAttribute('data-theme', (h >= 19 || h < 7) ? 'dark' : 'light');
          } catch(e) {}
        };
        setInterval(auto, 10 * 60 * 1000);
        document.addEventListener('visibilitychange', function(){ if (!document.hidden) auto(); });
      } catch(e) {}
    })();
    // Giveaways require login, same as claiming requires it server-side.
    (function(){
      try {
        if (!localStorage.getItem('ksl_token')) { window.location.replace('/login'); }
      } catch(e) {}
    })();
  </script>

  <style>
    .gw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:20px}
    .gw-card{background:var(--card);border:1px solid var(--border2);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
    .gw-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .gw-card-img{width:100%;height:150px;object-fit:cover;background:var(--bg4)}
    .gw-card-noimg{width:100%;height:150px;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--bg4)}
    .gw-card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .gw-card-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--gold)}
    .gw-card-title{font-size:16.5px;font-weight:800;color:var(--t1)}
    .gw-card-desc{font-size:13px;color:var(--t2);line-height:1.5;flex:1}
    .gw-card-status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:20px;width:fit-content}
    .gw-status-active{background:rgba(0,212,106,.15);color:#00d46a}
    .gw-status-claimed{background:rgba(255,71,87,.12);color:#ff6b7a}
    .gw-winner-row{display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg4);border-radius:10px;font-size:13px}
    .gw-winner-pic{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
    .gw-winner-name{font-weight:700;color:var(--t1)}
    .gw-winner-tag{color:var(--t2);font-size:12px}
    .gw-countdown{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:20px;width:fit-content;background:rgba(74,222,128,.14);color:#4ade80}
    .gw-claim-btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;background:var(--gold);color:#15150a;transition:transform .12s}
    .gw-claim-btn:hover{transform:translateY(-1px)}
    .gw-claim-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .gw-empty{text-align:center;padding:60px 20px;color:var(--t2)}
    .gw-empty-icon{font-size:48px;margin-bottom:10px}
    /* WIN MODAL */
    .gw-win-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:600;padding:16px}
    .gw-win-ov.open{display:flex}
    .gw-win-box{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:28px;max-width:420px;width:100%;text-align:center}
    .gw-win-emoji{font-size:56px;margin-bottom:6px}
    .gw-win-title{font-size:20px;font-weight:900;color:var(--gold);margin-bottom:4px}
    .gw-win-sub{font-size:13.5px;color:var(--t2);margin-bottom:16px}
    .gw-win-creds{background:var(--bg4);border:1px solid var(--border2);border-radius:10px;padding:14px;text-align:left;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;margin-bottom:14px;color:var(--t1)}
    .gw-win-copy{width:100%;padding:11px;border:none;border-radius:10px;background:var(--gold);color:#15150a;font-weight:800;font-size:14px;cursor:pointer;margin-bottom:10px}
    .gw-win-close{width:100%;padding:10px;border:1px solid var(--border2);border-radius:10px;background:transparent;color:var(--t2);font-weight:600;font-size:13.5px;cursor:pointer}
  </style>

  <p>Be the fastest to tap "Claim & Win" and the account is yours instantly. Miss it? Try harder next time.</p>
</div>

<!-- WIN MODAL -->
<div id="gwWinOverlay" class="gw-win-ov">
  <div class="gw-win-box">
 <div class="gw-win-emoji"><svg class="icon i-medal" aria-hidden="true"><use href="#i-medal"/></svg></div>
    <div class="gw-win-title">You Won!</div>
    <div class="gw-win-sub" id="gwWinTitle">Giveaway</div>
    <div class="gw-win-creds" id="gwWinCreds">—</div>
 <button class="gw-win-copy" onclick="copyGwCreds()"><svg class="icon i-clipboard" aria-hidden="true"><use href="#i-clipboard"/></svg> Copy Credentials</button>
    <button class="gw-win-close" onclick="closeGwWinModal()">Close</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/money.js?v=20260910a"></script>
<script src="script.js?v=20260910a"></script>
 <script src="/js/announcements.js"></script>
<script>
  let gwWinCredsText = '';
  let gwCountdownTimer = null;
  let gwLatestList = [];

  async function loadGiveawaysPage() {
    const grid = document.getElementById('gwGrid');
    try {
      gwLatestList = await req('/api/giveaways', 'GET', null, true);
      renderGiveaways();
      startGwCountdownTimer();
    } catch (e) {
      grid.innerHTML = `<div class="gw-empty" style="grid-column:1/-1;color:var(--red)">${esc(e.message)}</div>`;
    }
  }

  function renderGiveaways() {
    const grid = document.getElementById('gwGrid');
    const list = gwLatestList;
    if (!list.length) {
      grid.innerHTML = `<div class="gw-empty" style="grid-column:1/-1"><div class="gw-empty-icon"><svg class="icon i-gift" aria-hidden="true"><use href="#i-gift"/></svg></div>No giveaways right now — check back soon!</div>`;
      return;
    }
    grid.innerHTML = list.map(g => {
      const img = g.imageUrl
        ? `<img src="${esc(g.imageUrl)}" class="gw-card-img" alt=""/>`
        : `<div class="gw-card-noimg"><svg class="icon i-gift" aria-hidden="true"><use href="#i-gift"/></svg></div>`;
      const notYetOpen = g.status === 'active' && new Date(g.startsAt).getTime() > Date.now();

      let statusHtml, actionHtml;
      if (g.status === 'claimed') {
        statusHtml = `<span class="gw-card-status gw-status-claimed"><svg class="icon i-flag" aria-hidden="true"><use href="#i-flag"/></svg> Claimed</span>`;
        actionHtml = `<div class="gw-winner-row">
             <div class="gw-winner-pic">${g.winnerProfilePicture ? `<img src="${esc(g.winnerProfilePicture)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover"/>` : '<svg class="icon i-user" aria-hidden="true"><use href="#i-user"/></svg>'}</div>
             <div><div class="gw-winner-name"><svg class="icon i-medal" aria-hidden="true"><use href="#i-medal"/></svg> ${esc(g.winnerName || 'A member')}</div><div class="gw-winner-tag">won this giveaway — try harder next time!</div></div>
           </div>`;
      } else if (notYetOpen) {
        statusHtml = `<span class="gw-countdown" data-starts-at="${esc(g.startsAt)}">⏳ Opens in <span class="gw-countdown-val" data-gw-id="${g._id}">…</span></span>`;
        actionHtml = `<button class="gw-claim-btn" disabled data-gw-id="${g._id}"><svg class="icon i-lock" aria-hidden="true"><use href="#i-lock"/></svg> Not Open Yet</button>`;
      } else {
        statusHtml = `<span class="gw-card-status gw-status-active"><svg class="icon i-dot" aria-hidden="true"><use href="#i-dot"/></svg> Active — up for grabs</span>`;
        actionHtml = `<button class="gw-claim-btn" onclick="claimGiveaway('${g._id}')"><svg class="icon i-zap" aria-hidden="true"><use href="#i-zap"/></svg> Claim &amp; Win</button>`;
      }

      return `<div class="gw-card">
          ${img}
          <div class="gw-card-body">
            ${g.category ? `<div class="gw-card-cat">${esc(g.category)}</div>` : ''}
            <div class="gw-card-title">${esc(g.title)}</div>
            ${g.description ? `<div class="gw-card-desc">${esc(g.description)}</div>` : ''}
            ${statusHtml}
            ${actionHtml}
          </div>
        </div>`;
    }).join('');
  }

  // Ticks every second: updates each countdown label, and once a giveaway's timer hits zero it
  // re-fetches the list so the button flips from "Not Open Yet" to a live "Claim & Win".
  function startGwCountdownTimer() {
    if (gwCountdownTimer) clearInterval(gwCountdownTimer);
    gwCountdownTimer = setInterval(() => {
      let anyJustOpened = false;
      document.querySelectorAll('.gw-countdown-val').forEach(el => {
        const wrap = el.closest('.gw-countdown');
        const startsAt = new Date(wrap.dataset.startsAt).getTime();
        const diff = startsAt - Date.now();
        if (diff <= 0) { anyJustOpened = true; return; }
        el.textContent = formatCountdown(diff);
      });
      if (anyJustOpened) loadGiveawaysPage();
    }, 1000);
  }

  function formatCountdown(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return `${h}h ${m}m ${s}s`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
  }

  async function claimGiveaway(id) {
    try {
      const data = await req(`/api/giveaways/${id}/claim`, 'POST', {}, true);
      gwWinCredsText = data.credentials;
      document.getElementById('gwWinTitle').textContent = data.title;
      document.getElementById('gwWinCreds').textContent = data.credentials;
      document.getElementById('gwWinOverlay').classList.add('open');
      loadGiveawaysPage();
    } catch (e) {
 showToast(' ' + e.message, 'err');
      loadGiveawaysPage(); // refresh so the now-claimed status/winner shows immediately
    }
  }

  function closeGwWinModal() {
    document.getElementById('gwWinOverlay').classList.remove('open');
  }
  function copyGwCreds() {
 navigator.clipboard?.writeText(gwWinCredsText).then(() => showToast('Copied! ', 'ok'));
  }

  document.addEventListener('DOMContentLoaded', () => {
    initTheme?.();
    loadGiveawaysPage();
  });
</script>
